<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .tarjeta {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .botones {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
        }
        .btn-si {
            background-color: #2ecc71;
            color: white;
        }
        .btn-si:hover { background-color: #27ae60; transform: scale(1.05); }
        
        .btn-no {
            background-color: #e74c3c;
            color: white;
        }
        .btn-no:hover { background-color: #c0392b; transform: scale(1.05); }

        #mensaje-exito {
            display: none;
            color: #27ae60;
        }
        #mensaje-exito h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <!-- Contenedor de la pregunta -->
        <div id="contenedor-pregunta">
            <h1>¿Y ahora qué? cree una nueva posibilidad o no</h1>
            
            <!-- Reemplaza "TU_ENLACE_DE_FORMSPREE" en el action de abajo -->
            <form id="formulario-respuesta" action="https://formspree.io/f/xyezdvel" method="POST">
                <input type="hidden" name="Pregunta" value="¿Y ahora qué? cree una nueva posibilidad o no">
                <input type="hidden" name="Respuesta" id="input-respuesta" value="">
                
                <div class="botones">
                    <button type="button" class="btn-si" onclick="enviarRespuesta('Sí')">Sí</button>
                    <button type="button" class="btn-no" onclick="enviarRespuesta('No')">No</button>
                </div>
            </form>
        </div>

        <!-- Mensaje de agradecimiento (Oculto por defecto) -->
        <div id="mensaje-exito">
            <h2>¡Gracias!</h2>
            <p>Tu respuesta ha sido enviada al administrador.</p>
        </div>
    </div>

    <script>
        async function enviarRespuesta(valor) {
            const form = document.getElementById('formulario-respuesta');
            const inputRespuesta = document.getElementById('input-respuesta');
            const contenedorPregunta = document.getElementById('contenedor-pregunta');
            const mensajeExito = document.getElementById('mensaje-exito');

            // Asignamos el valor del botón (Sí o No) al input oculto
            inputRespuesta.value = valor;

            // Verificamos que se haya puesto el enlace de Formspree
            if (form.action.includes("TU_ENLACE_DE_FORMSPREE")) {
                alert("Atención: Debes reemplazar 'TU_ENLACE_DE_FORMSPREE' en el código por tu enlace real.");
                return;
            }

            try {
                // Enviamos los datos sin recargar la página usando Fetch API
                const response = await fetch(form.action, {
                    method: form.method,
                    body: new FormData(form),
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Si se envía bien, ocultamos la pregunta y mostramos el agradecimiento
                    contenedorPregunta.style.display = 'none';
                    mensajeExito.style.display = 'block';
                } else {
                    alert("Hubo un problema al enviar la respuesta.");
                }
            } catch (error) {
                alert("Error de conexión. Intenta nuevamente.");
            }
        }
    </script>
</body>
</html>
